<!-- The `snake-demo-page` class only styles THIS standalone page.
     None of it is needed when the game is embedded elsewhere. -->
<body class="snake-demo-page">

  <main class="snake-demo-page__inner">

         Everything inside it is written by js/ui.js at runtime. -->
    <div id="snake-game"></div>
  </main>

  <!-- Load order matters: config first, main last. -->
  <script src="js/config.js?v=20260919b"></script>
  <script src="js/storage.js?v=20260919b"></script>

  <script src="js/ui.js?v=20260919b"></script>

  <script src="js/main.js?v=20260919b"></script>
